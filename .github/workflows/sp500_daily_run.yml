name: SP500 正式模型 v17 每日报告
on:
  schedule:
    - cron: '30 22 * * *' # 北京时间每日 06:30，美股收盘后 90/150 分钟
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sp500-monitor-production
  cancel-in-progress: false
jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECEIVER: ${{ vars.EMAIL_RECEIVER }}
    steps:
      - name: 拉取正式代码
        uses: actions/checkout@v4
      - name: 拉取持久化数据
        uses: actions/checkout@v4
        with:
          ref: data
          path: persisted
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 安装固定版本依赖
        run: pip install -r requirements.txt
      - name: 正式模型回归检查
        run: python -m unittest discover -s tests -v
      - name: 恢复 v17 数据
        run: |
          mkdir -p data reports
          if [ -d persisted/data/v17 ]; then cp -a persisted/data/v17 data/; fi
      - name: 计算因子并发送邮件
        run: python -m monitor_v17.main
      - name: 发送运行失败通知
        if: failure()
        run: python monitor_v17/notify_pipeline_failure.py
      - name: 保存报告和原始数据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sp500-v17-${{ github.run_id }}
          path: |
            reports/
            data/v17/
            !data/v17/raw/factset_*
          retention-days: 90
      - name: 持久化数据与邮件回执
        if: always()
        run: |
          if [ ! -d data/v17 ]; then exit 0; fi
          mkdir -p persisted/data/v17
          rsync -a --exclude raw/ data/v17/ persisted/data/v17/
          cd persisted
          git config user.name 'GitHub Actions Bot'
          git config user.email 'github-actions@github.com'
          git add data/v17
          if ! git diff --cached --quiet; then
            git commit -m "v17 daily snapshot $GITHUB_RUN_ID"
            git push origin HEAD:data
          fi
